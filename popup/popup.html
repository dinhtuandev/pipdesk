<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PiPDesk</title>
    <link rel="stylesheet" href="../shared/tokens.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <div>
        <h1>PiPDesk</h1>
        <p class="head__sub">
          Float a tab, a region, or your own tools above your work.
        </p>
      </div>
      <span class="status" id="status" aria-hidden="true"></span>
    </header>

    <section class="group">
      <h2 class="group__label">Capture this tab</h2>
      <div class="stack">
        <button class="action" id="cap-full" type="button">
          <span class="action__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4"/><path d="M8 20h8"/></svg>
          </span>
          <span class="action__text">
            <span class="action__title">Whole tab</span>
            <span class="action__hint">Everything on the page</span>
          </span>
        </button>

        <button class="action" id="cap-region" type="button">
          <span class="action__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16 2.3 4.7L20 10l-4.7 2.3L13 17l-2.3-4.7L6 10l4.7-2.3L13 3Z"/></svg>
          </span>
          <span class="action__text">
            <span class="action__title">Selected region</span>
            <span class="action__hint">Drag a box over any part</span>
          </span>
        </button>

        <button class="action" id="cap-video" type="button">
          <span class="action__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="14" height="14" rx="2"/><path d="m17 10 5-3v10l-5-3z"/></svg>
          </span>
          <span class="action__text">
            <span class="action__title">Video on the page</span>
            <span class="action__hint">Use the player's own PiP</span>
          </span>
        </button>

        <button class="action action--stop" id="stop" type="button" hidden>
          <span class="action__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          </span>
          <span class="action__text">
            <span class="action__title">Stop PiP</span>
            <span class="action__hint" id="stop-hint">Nothing is floating yet</span>
          </span>
        </button>
      </div>
    </section>

    <section class="group">
      <h2 class="group__label">Own panels</h2>
      <div class="grid">
        <button class="tile" id="panel-notes" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4M12 2v4M16 2v4"/><rect width="16" height="18" x="4" y="4" rx="2"/><path d="M8 10h6M8 14h8M8 18h5"/></svg>
          Notes
        </button>
        <button class="tile" id="panel-todos" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          Todos
        </button>
        <button class="tile" id="panel-timer" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          Focus
        </button>
      </div>
    </section>

    <p class="note" id="note" role="status"></p>

    <footer class="foot">
      <label class="switch">
        <input type="checkbox" id="sync" />
        <span class="switch__track" aria-hidden="true"><span class="switch__knob"></span></span>
        <span class="switch__label">Sync across devices</span>
      </label>
      <span class="ver" id="version"></span>
    </footer>

    <script src="../shared/store.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
