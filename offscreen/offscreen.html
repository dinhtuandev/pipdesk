<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PiPDesk capture</title>
    <link rel="stylesheet" href="../shared/tokens.css" />
  </head>
  <body>
    <!-- Invisible working surface. Every source is decoded in its own hidden
         <video> and painted into this one canvas, because a document can only
         ever hold a single picture-in-picture window. -->
    <canvas id="composite-canvas" width="1280" height="720"></canvas>
    <video id="pip-video" playsinline muted></video>
    <script src="layout.js"></script>
    <script src="offscreen.js"></script>
  </body>
</html>
